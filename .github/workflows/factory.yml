on:
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
      push:
        required: true
        type: boolean
      refs:
        required: false
        type: string
        default: ""

env:
  PLATFORMS: linux/amd64,linux/arm64

jobs:
  build-binaries:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    steps:
    - name: Checkout code without refs
      if: ${{ inputs.refs == '' }}
      uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

    - name: Checkout code with refs
      if: ${{ inputs.refs != '' }}
      uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      with:
        ref: ${{ inputs.refs }}

    - name: Run make ci
      run: make ci

    - name: Upload ${{ matrix.arch }} binaries
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
      with:
        name: csi-driver-lvm-bin-${{ matrix.arch }}
        path: bin/*-${{ matrix.arch }}
        retention-days: 1

  publish:
    needs: build-binaries
    if: ${{ inputs.push == true }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: harvester-lvm-csi-plugin
            dockerfile: package/Dockerfile
          - image: harvester-lvm-provisioner
            dockerfile: package/Dockerfile.provisioner
          - image: harvester-lvm-csi-driver-webhook
            dockerfile: package/Dockerfile.webhook
    steps:
    - name: checkout code without refs
      if: ${{ inputs.refs == '' }}
      uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

    - name: Checkout code with refs
      if: ${{ inputs.refs != '' }}
      uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      with:
        ref: ${{ inputs.refs }}

    - name: Download native-built binaries
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        pattern: csi-driver-lvm-bin-*
        path: bin
        merge-multiple: true

    - name: Set up QEMU
      uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

    - name: Resolve registries
      id: resolve
      uses: harvester/harvester-actions/actions/resolve-registries@f5246cd8d423922ea55141991155f4b05f665bd5 # main
      with:
        release-tag-name: ${{ inputs.tag }}
        is-release: ${{ github.event_name == 'release' && github.event.action == 'published' }}

    - name: Set image tag
      run: echo "IMAGE_TAG=${RELEASE_TAG_NAME#prime-}" >> "$GITHUB_ENV"
      env:
        RELEASE_TAG_NAME: ${{ inputs.tag }}

    - name: Login to Docker Hub
      id: login-docker
      if: ${{ steps.resolve.outputs.use-docker-io == 'true' }}
      uses: harvester/harvester-actions/actions/login-docker-hub@f5246cd8d423922ea55141991155f4b05f665bd5 # main

    - name: Publish public ${{ matrix.image }} image
      if: ${{ steps.resolve.outputs.use-docker-io == 'true' }}
      uses: harvester/harvester-actions/actions/publish-public-image@f5246cd8d423922ea55141991155f4b05f665bd5 # main
      with:
        context: .
        dockerfile: ${{ matrix.dockerfile }}
        image: ${{ matrix.image }}
        tag: ${{ env.IMAGE_TAG }}
        platforms: ${{ env.PLATFORMS }}
        registry: ${{ steps.login-docker.outputs.registry }}
        repository: ${{ steps.login-docker.outputs.repository }}

    - name: Login to Staging Registry
      id: login-staging
      if: ${{ steps.resolve.outputs.use-staging == 'true' }}
      uses: harvester/harvester-actions/actions/login-staging-registry@f5246cd8d423922ea55141991155f4b05f665bd5 # main

    - name: Publish staging ${{ matrix.image }} image
      if: ${{ steps.resolve.outputs.use-staging == 'true' }}
      uses: harvester/harvester-actions/actions/publish-prime-image@f5246cd8d423922ea55141991155f4b05f665bd5 # main
      with:
        context: .
        dockerfile: ${{ matrix.dockerfile }}
        image: ${{ matrix.image }}
        tag: ${{ env.IMAGE_TAG }}
        platforms: ${{ env.PLATFORMS }}
        registry: ${{ steps.login-staging.outputs.registry }}
        repository: ${{ steps.login-staging.outputs.repository }}

    - name: Login to Prime Registry
      id: login-prime
      if: ${{ steps.resolve.outputs.use-prime == 'true' }}
      uses: harvester/harvester-actions/actions/login-prime-registry@f5246cd8d423922ea55141991155f4b05f665bd5 # main

    - name: Publish prime ${{ matrix.image }} image
      if: ${{ steps.resolve.outputs.use-prime == 'true' }}
      uses: harvester/harvester-actions/actions/publish-prime-image@f5246cd8d423922ea55141991155f4b05f665bd5 # main
      with:
        context: .
        dockerfile: ${{ matrix.dockerfile }}
        image: ${{ matrix.image }}
        tag: ${{ env.IMAGE_TAG }}
        platforms: ${{ env.PLATFORMS }}
        registry: ${{ steps.login-prime.outputs.registry }}
        repository: ${{ steps.login-prime.outputs.repository }}
